<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIBSYS Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="left-header">
    <div class="logo-container">
      <img src="images/logo.png" alt="LibSys Logo">
      <h2 id="logoName">LIBSYS</h2>
    </div>
    <nav class="navigation">
      <a href="dashboard.html">HOME</a>
      <a class="active" href="librarypage.html">LIBRARY</a>
      <a href="requests.html">REQUESTS</a>
    </nav>
  </div>
  <div class="right-header">
    <a href="accountPage.html" id="account">
      <img src="images/account.png" alt="Account"> Account
    </a>
    <button id="notifications">
      <img src="images/notifications.png" alt="Notifs"> Notifications
    </button>
    <button id="logoutBtn" class="logout-nav-btn" onclick="localStorage.removeItem('libsys_user'); window.location.href='login_page.html'">Log Out</button>
  </div>
</div>

<div id="notifBar" class="hidden">
  <div class="notif">
    <h3>Notifications</h3>
    <p>No new notifications.</p>
  </div>
</div>

<!-- Library Content -->
<div class="library-wrapper">
  <div class="library-header">
    <h2>Book Collection</h2>
    <div class="library-stats">
      <div class="stat-chip">Total: <strong id="stat-total">—</strong></div>
      <div class="stat-chip available-chip">Available: <strong id="stat-available">—</strong></div>
      <div class="stat-chip borrowed-chip">Borrowed: <strong id="stat-borrowed">—</strong></div>
    </div>
  </div>

  <div class="library-controls">
    <input type="text" id="search-input" placeholder="Search by title, author, or ISBN..." class="search-bar">
    <select id="genre-filter" class="filter-select">
      <option value="all">All Genres</option>
    </select>
    <select id="status-filter" class="filter-select">
      <option value="all">All Status</option>
      <option value="available">Available</option>
      <option value="borrowed">Borrowed</option>
    </select>
  </div>

  <div id="books-grid" class="books-grid">
    <p>Loading books...</p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="library.js"></script>
</body>
</html>
